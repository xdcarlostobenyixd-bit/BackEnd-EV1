<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Agenda de Contactos{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 22px;
        }

        header .contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        .contenedor {
            width: min(1100px, 92%);
            margin: auto;
        }

        main {
            padding: 35px 0;
        }

        .tarjeta {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            margin-bottom: 20px;
        }

        .barra-busqueda {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .barra-busqueda input {
            flex: 1;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        button, .boton {
            display: inline-block;
            border: 0;
            border-radius: 6px;
            padding: 10px 15px;
            text-decoration: none;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        .secundario { background: #6b7280; }
        .peligro { background: #dc2626; }
        .exito { background: #16a34a; }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 13px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f0f2f5;
        }

        .acciones {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .mensaje {
            padding: 12px;
            margin-bottom: 15px;
            background: #dcfce7;
            border-radius: 6px;
        }

        .errorlist {
            color: #b91c1c;
            margin-top: 5px;
        }

        @media (max-width: 700px) {
            header .contenedor {
                flex-direction: column;
                align-items: flex-start;
            }

            table {
                font-size: 13px;
            }

            th:nth-child(4), td:nth-child(4) {
                display: none;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="contenedor">
        <h1>Agenda de Contactos Personal</h1>
        <nav>
            <a href="{% url 'lista_contactos' %}">Inicio</a>
            <a href="{% url 'agregar_contacto' %}">Agregar contacto</a>
        </nav>
    </div>
</header>

<main class="contenedor">
    {% if messages %}
        {% for message in messages %}
            <div class="mensaje">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</main>

</body>
</html>
